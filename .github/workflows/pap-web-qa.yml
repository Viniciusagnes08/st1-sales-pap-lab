name: ST1 PAP Web QA
on:
  pull_request:
    branches: [main]
  push:
    branches: [main, feat/web-operations-complete]
permissions:
  contents: read
jobs:
  validation:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
      - name: Verificar sintaxe da Web
        run: |
          node --check web-preview/app.js
          node --check web-preview/operations.js
          node --check web-preview/map.js
          node --check web-preview/sample-data.js
          node --check web-preview/sales.js
      - name: Rodar testes
        run: npm test
